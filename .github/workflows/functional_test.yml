name: tests

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:

    runs-on: ubuntu-latest

    steps:

    - name: Get the source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes expect podman
        python3 -m pip install coverage

    - name: Use the test Dockerfile
      run: cp tests/Dockerfile Dockerfile

    - name: Test image management
      run: ./tests_for_manage_images.sh

    - name: Restore the test Dockerfile
      run: git checkout -- Dockerfile

    # The container must be built for the runner:1001:1001 user; otherwise, tests will crash.
    # To avoide double dowload we pull image from docker daemon to podman
    - name: Download pre-built containers for testing
      run: |
        image=ghcr.io/willenst/kernel-build-container-runner-1001:gcc-13

        docker pull "$image"
        docker tag "$image" kernel-build-container:clang-15
        docker tag "$image" kernel-build-container:gcc-13

        podman pull "docker-daemon:$image"
        podman tag "$image" kernel-build-container:clang-15
        podman tag "$image" kernel-build-container:gcc-13

    - name: Test kernel building
      run: ./tests_for_build_linux.sh --fast